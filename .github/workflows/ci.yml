name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # lockfile currently incomplete; use install until a full lock is committed
      - name: Install
        run: npm install

      - name: Typecheck and build
        run: npm run build
